{% extends "base.html" %}

{% block body_class %}team-page{% endblock %}

{% block title %}Team - Task Tracker{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/team.css') }}">
{% endblock %}

{% block content %}

<div class="team-heading">
<h1>Meet the Team</h1>
<p class="sub-heading">The minds behind Bunny Tracker 🥕</p>
</div>

<div class="team-grid" id="team-container"></div>


{% endblock %}




{% block scripts %}

<script>
const team = [
    {
        name: "Mohith",
        role: "Frontend Developer",
        image: "images/avatar_1.png",
    },
    {
        name: "Tongyu",
        role: "Backend Developer",
        image: "images/avatar_2.png"
    },
    {
        name: "Mercy",
        role: "Scrum Master",
        image: "images/avatar_3.png"
    },
    {
        name: "Yu",
        role: "Onboarding Developer",
        image: "images/avatar_4.png"
    },
    {
        name: "Puna",
        role: "Presenter",
        image: "images/avatar_5.png"
    }
];

const container = document.getElementById("team-container");

team.forEach(member => {
    const card = document.createElement("div");
    card.className = "team-card";

    card.innerHTML = `
        <div class="card-inner">

            <div class="card-front">
                
                <div class="carrot">🐰</div>
                <h3>${member.name}</h3>
            </div>

            <div class="card-back">
                    <img src="/static/${member.image}" class="profile-img">
                <p>${member.role}</p>
            </div>

        </div>
    `;

    container.appendChild(card);
});

setTimeout(() => {
    document.querySelectorAll(".team-card").forEach((card, i) => {
        card.style.animation = `hopStack 0.6s ease forwards ${i * 0.1}s`;
    });
}, 50);
</script>

{% endblock %}
